<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Undangan Pernikahan</title>
    <style>
        /* CSS: Tampilan Web */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
        }

        /* Highlight untuk dropdown link agar terlihat beda */
        #pilihanLink {
            background-color: #e8f0fe;
            border-color: #b3d7ff;
            color: #1a73e8;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        .btn-copy {
            background-color: #008CBA;
            margin-top: 10px;
        }

        .btn-copy:hover {
            background-color: #007bb5;
        }

        .result-area {
            margin-top: 25px;
            border-top: 2px dashed #ddd;
            padding-top: 20px;
            display: none;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: monospace;
            resize: none;
            background-color: #fafafa;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💌 Generator Undangan</h2>

        <div class="form-group">
            <label for="pilihanLink">Pilih Website Undangan:</label>
            <select id="pilihanLink">
                <option value="github">Link Baru (arutafuuu.github.io)</option>
                <option value="truelove">Link Lama (invite.truelove.my.id)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="penerima">Nama Penerima (Tamu):</label>
            <input type="text" id="penerima" placeholder="Contoh: Budi Santoso">
        </div>

        <div class="form-group">
            <label for="opsiPartner">Format Tamu:</label>
            <select id="opsiPartner">
                <option value="0">Sendiri (Tanpa & Ny)</option>
                <option value="1">Berpasangan (Tambah & Ny)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="pengirim">Nama Pengirim (Mempelai):</label>
            <input type="text" id="pengirim" placeholder="Contoh: Uni & Innu">
        </div>

        <button onclick="buatUndangan()">Buat Pesan</button>

        <div class="result-area" id="hasilArea">
            <label>Hasil Pesan:</label>
            <textarea id="outputPesan" readonly></textarea>
            <button class="btn-copy" onclick="salinPesan()">Salin ke Clipboard</button>
        </div>
    </div>

    <script>
        function buatUndangan() {
            // 1. Ambil nilai
            const jenisLink = document.getElementById('pilihanLink').value;
            const namaPenerima = document.getElementById('penerima').value.trim();
            const namaPengirim = document.getElementById('pengirim').value.trim();
            const opsiPartner = document.getElementById('opsiPartner').value;

            // Validasi
            if (namaPenerima === "" || namaPengirim === "") {
                alert("Mohon isi Nama Penerima dan Nama Pengirim.");
                return;
            }

            // Encode nama agar aman di URL (spasi jadi %20)
            const namaDiLink = encodeURIComponent(namaPenerima);
            
            let linkUndangan = "";

            // 2. LOGIKA PEMILIHAN LINK
            if (jenisLink === "truelove") {
                // Format Link Lama (invite.truelove.my.id)
                // Biasanya format lama pakai parameter "?to="
                linkUndangan = `https://invite.truelove.my.id/uni-innu/?to=${namaDiLink}`;
            
            } else {
                // Format Link Baru (arutafuuu.github.io)
                // Menggunakan parameter "?name=" dan "&ny="
                linkUndangan = `https://arutafuuu.github.io/ibnu-uni/?name=${namaDiLink}&ny=${opsiPartner}`;
            }

            // 3. Template Pesan
            const templatePesan = `Kepada Yth.
Bapak/Ibu/Saudara/i
*${namaPenerima}*

_______

Assalamualaikum Warahmatullahi Wabarakatuh

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara kami.

Berikut link undangan terlampir, untuk info lengkap dari acara, bisa kunjungi :

${linkUndangan}

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.

Wassalamualaikum Warahmatullahi Wabarakatuh

Terima Kasih

Hormat kami,
${namaPengirim}
________`;

            // 4. Output
            document.getElementById('outputPesan').value = templatePesan;
            document.getElementById('hasilArea').style.display = 'block';
        }

        function salinPesan() {
            const copyText = document.getElementById("outputPesan");
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value).then(() => {
                alert("Pesan berhasil disalin!");
            });
        }
    </script>
</body>
</html>

    <!-- Preloader Start -->
    <div id="preloader-active">
        <div class="preloader d-flex align-items-center justify-content-center">
            <div class="preloader-inner position-relative">

    <audio id="welcomeAudio" src="./assets/audio/wedding-ceremony-music-349803.mp3" preload="auto"></audio>
    <div class="d-flex justify-content-center align-items-center h-100">
        <div class="container-box">
            <h1>Kepada Yth.</h1>
            <p><strong><span id="name"></span><span id="ny"></span></strong></p>
            <p>Di -</p>
            <p><strong>Tempat</strong></p>
            <button onclick="playAudioAndRedirect()" class="btn btn-sm btn-lg">Lihat Undangan</button>
        </div>
    </div>
    <!-- JS here -->
    <script>
        function playAudioAndRedirect() {
            const audio = document.getElementById("welcomeAudio");
            audio.play();
            window.location.href = "home.html";
        }

        // Ambil parameter dari URL
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');

        const greetingElement = document.getElementById('name');
        if (name) {
            greetingElement.textContent = `${name}`;
        } else {
            greetingElement.textContent = 'Tuan';
        }

        const ny = params.get('ny');

        if (ny == 1) {
            greetingElement.textContent += ` & Ny.`;
        } else if (ny == 2) {
            greetingElement.textContent += ` & Tn.`;
        }
    </script>
